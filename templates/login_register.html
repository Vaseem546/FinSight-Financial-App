<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FinSight — Sign in</title><link rel="stylesheet" href="{{ url_for('static', filename='global.css') }}"></head><body><main class="auth-shell"><section class="auth-brand"><a class="brand-lockup" href="#"><span>F</span><strong>FinSight</strong></a><div><p>MARKET WORKSPACE</p><h1>Invest with<br>clearer context.</h1></div><small>Analysis · Screening · Portfolio</small></section><section class="auth-panel"><div class="auth-card"><div class="auth-tabs"><button type="button" id="loginTab" class="{{ 'active' if show == 'login' else '' }}">Log in</button><button type="button" id="registerTab" class="{{ 'active' if show == 'register' else '' }}">Create account</button></div><div id="loginForm" class="auth-form {{ 'active' if show == 'login' else '' }}"><p class="eyebrow">WELCOME BACK</p><h2>Sign in to FinSight</h2>{% if error and show == 'login' %}<div class="auth-error">{{ error }}</div>{% endif %}<form method="POST" action="{{ url_for('login') }}"><label>Email address<input type="email" name="email" placeholder="name@example.com" required></label><label>Password<input type="password" name="password" placeholder="Enter your password" required></label><button class="auth-submit" type="submit">Log in</button></form></div><div id="registerForm" class="auth-form {{ 'active' if show == 'register' else '' }}"><p class="eyebrow">NEW WORKSPACE</p><h2>Create your account</h2>{% if error and show == 'register' %}<div class="auth-error">{{ error }}</div>{% endif %}<form method="POST" action="{{ url_for('register') }}"><label>Email address<input type="email" name="email" placeholder="name@example.com" required></label><label>Password<input type="password" name="password" placeholder="Create a password" required></label><button class="auth-submit" type="submit">Create account</button></form></div></div></section></main><script>const l=document.getElementById('loginTab'),r=document.getElementById('registerTab'),lf=document.getElementById('loginForm'),rf=document.getElementById('registerForm');function login(){lf.classList.add('active');rf.classList.remove('active');l.classList.add('active');r.classList.remove('active')}function register(){rf.classList.add('active');lf.classList.remove('active');r.classList.add('active');l.classList.remove('active')}l.onclick=login;r.onclick=register;{% if show == 'register' %}register();{% endif %}</script></body></html>
